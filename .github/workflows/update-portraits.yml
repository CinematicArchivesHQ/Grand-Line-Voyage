name: Update character pictures

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only these character ids (comma-separated). Leave blank for everyone missing a picture."
        type: string
        default: ""
      force:
        description: "Re-download pictures that already exist"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Fetch pictures from the One Piece Wiki
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=""
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          if [ "$FORCE" = "true" ]; then ARGS="$ARGS --force"; fi
          python tools/update_portraits.py $ARGS
      - name: Summary
        run: cat tools/portraits_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain assets/portraits js/portraits.js tools/portraits_report.md)" ]; then echo "No changes."; exit 0; fi
          git config user.name "grand-line-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/portraits js/portraits.js tools/portraits_report.md
          git commit -m "Update character pictures from the One Piece Wiki ($(date -u +%Y-%m-%d))"
          git pull --rebase origin main
          git push
